services:
  - type: web
    name: lablink
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
